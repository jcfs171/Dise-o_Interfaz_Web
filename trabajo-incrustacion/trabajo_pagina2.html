<body style="text-align: center; background-color: yellow; font-family: Georgia, 'Times New Roman', Times, serif;">
    <h1></h1>
    <h2>Calendario</h2>
    <embed src="calendarioF1_2026.pdf" style="height: 300px; width: 500px;">
    <br>
    <h2>Rectángulo (canvas)</h2>
    <canvas id="lienzo" width="200" height="100" style="border: 2px solid black;"></canvas>
    <script>
    const canvas = document.getElementById("lienzo");
    const pincel = canvas.getContext("2d");
    pincel.fillStyle = "red";
    pincel.fillRect(50, 25, 100, 50);
    </script>
    <br>
    <h2>Calendario (object)</h2>
    <object data="calendarioF1_2026.pdf" type="application/pdf" width="800" height="500">
    <p>No se puede mostrar el PDF. <a href="calendarioF1_2026.pdf">Descargalo aqui</a>.</p>
    </object>
